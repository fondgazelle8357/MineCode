<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" role="img" aria-labelledby="title desc">
  <title id="title">MineCode architecture: the agent stays in control</title>
  <desc id="desc">Your coding agent owns reasoning, edits, Git and permissions. It consults six MineCode skills and fourteen MCP tools for project facts, version-aware evidence and diagnostics. The agent changes your Minecraft project; MineCode reads selected project inputs and evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#83C6A1"/></marker>
    <marker id="back" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#AEA1DC"/></marker>
  </defs>
  <rect x="1" y="1" width="638" height="618" rx="16" fill="#101419" stroke="#343E48"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="32" y="35" fill="#A6B1AD" font-size="13" font-weight="600" letter-spacing="1.4">MINECODE / SYSTEM BOUNDARIES</text>
    <rect x="56" y="59" width="528" height="103" rx="9" fill="#191F26" stroke="#83C6A1"/>
    <rect x="56" y="80" width="3" height="26" fill="#83C6A1"/>
    <text x="80" y="99" fill="#EDF1EC" font-size="29" font-weight="600">Your coding agent</text>
    <text x="80" y="132" fill="#A6B1AD" font-size="20">Reasoning / edits / permissions</text>
    <path d="M248 163 V220" fill="none" stroke="#83C6A1" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="88" y="197" fill="#83C6A1" font-size="21">consults</text>
    <path d="M390 221 V168" fill="none" stroke="#AEA1DC" stroke-width="2" marker-end="url(#back)"/>
    <text x="405" y="197" fill="#AEA1DC" font-size="21">evidence</text>
    <rect x="56" y="228" width="528" height="242" rx="9" fill="#191F26" stroke="#343E48"/>
    <text x="80" y="269" fill="#EDF1EC" font-size="29" font-weight="600">MineCode</text>
    <rect x="80" y="289" width="220" height="83" rx="5" fill="#101419" stroke="#343E48"/>
    <rect x="316" y="289" width="244" height="83" rx="5" fill="#101419" stroke="#343E48"/>
    <text x="96" y="319" fill="#83C6A1" font-size="23" font-weight="600">6 skills</text>
    <text x="96" y="350" fill="#A6B1AD" font-size="20">Minecraft guidance</text>
    <text x="332" y="319" fill="#83C6A1" font-size="23" font-weight="600">14 MCP tools</text>
    <text x="332" y="350" fill="#A6B1AD" font-size="20">Local MCP runtime</text>
    <path d="M80 392 H560" stroke="#343E48"/>
    <text x="80" y="421" fill="#EDF1EC" font-size="20">Project facts / evidence / diagnostics</text>
    <text x="80" y="450" fill="#A6B1AD" font-size="20">Version / mappings / source identity</text>
    <path d="M56 111 H25 V550 H49" fill="none" stroke="#83C6A1" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M584 548 H611 V422 H590" fill="none" stroke="#AEA1DC" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#back)"/>
    <text x="320" y="501" fill="#A6B1AD" font-size="21" text-anchor="middle">The agent owns every change.</text>
    <rect x="56" y="519" width="528" height="77" rx="9" fill="#191F26" stroke="#343E48"/>
    <text x="80" y="551" fill="#EDF1EC" font-size="26" font-weight="600">Your Minecraft project</text>
    <text x="80" y="579" fill="#A6B1AD" font-size="20">Source / build files / logs</text>
  </g>
</svg>
