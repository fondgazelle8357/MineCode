name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development checks
        run: python -m pip install -e ".[dev]"
      - name: Critical lint checks
        run: ruff check src tests scripts
      - name: Formatting check for adopted files
        run: ruff format --check scripts
      - name: Python type checks
        run: basedpyright
      - name: Unit tests
        run: python scripts/verify.py --full
      - name: Local documentation links
        run: python scripts/check_docs.py
      - name: Build wheel through source distribution
        run: python -m build
      - name: Isolated installed package acceptance (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/minecode-installed"
          "$RUNNER_TEMP/minecode-installed/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/minecode-installed/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_installation.py"
      - name: Isolated installed package acceptance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $environment = Join-Path $env:RUNNER_TEMP "minecode-installed"
          python -m venv $environment
          $python = Join-Path $environment "Scripts/python.exe"
          $wheel = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "dist/*.whl") | Select-Object -First 1
          & $python -m pip install $wheel.FullName
          Set-Location $env:RUNNER_TEMP
          & $python -I (Join-Path $env:GITHUB_WORKSPACE "scripts/check_installation.py")
