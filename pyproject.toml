[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minecode-runtime"
version = "0.4.0rc3"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
description = "Minecraft Java context and exact-version evidence for coding agents"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "pydantic>=2.12,<3", "PyYAML>=6.0.3,<7"]

[project.optional-dependencies]
dev = ["basedpyright==1.39.9", "ruff>=0.16.10,<1", "build==1.3.0"]

[project.scripts]
minecode = "minecode_runtime.cli:main"
minecode-semantic = "minecode_runtime.semantic_provider:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Check syntax and critical correctness errors.
select = ["E9", "F63", "F7", "F82"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
reportMissingTypeStubs = false
